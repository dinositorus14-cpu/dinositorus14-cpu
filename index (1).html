<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Commit Catcher</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --green:#3fb950; --red:#f85149; --text:#e6edf3; --muted:#8b949e; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow:hidden; touch-action:none; }
  #wrap { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:10px; padding:8px; }
  #hud { width:min(480px,100%); display:flex; justify-content:space-between; font-size:14px; color:var(--muted); }
  #hud b { color:var(--text); }
  canvas { background:var(--panel); border:1px solid var(--border); border-radius:10px;
    width:min(480px,100%); max-height:72vh; aspect-ratio:3/4; }
  #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(13,17,23,.82); }
  #card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px 28px; text-align:center; max-width:340px; }
  h1 { margin:0 0 8px; font-size:24px; }
  h1 span { color:var(--green); }
  p { color:var(--muted); font-size:13px; line-height:1.5; margin:6px 0; }
  button { margin-top:14px; background:var(--green); color:#04210d; border:0; border-radius:8px;
    padding:10px 22px; font:inherit; font-weight:700; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  #hint { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>Skor: <b id="score">0</b></span>
    <span>Nyawa: <b id="lives">♥♥♥</b></span>
    <span>Rekor: <b id="best">0</b></span>
  </div>
  <canvas id="c" width="480" height="640"></canvas>
  <div id="hint">← → atau geser jari untuk bergerak</div>
</div>
<div id="overlay">
  <div id="card">
    <h1>Commit <span>Catcher</span></h1>
    <p id="msg">Tangkap <b style="color:#3fb950">commit</b> yang jatuh.<br>Hindari <b style="color:#f85149">bug</b>!</p>
    <button id="start">Mulai Main</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const $ = id => document.getElementById(id);
  const overlay = $('overlay'), msg = $('msg');

  let best = 0;
  try { best = +localStorage.getItem('commit-catcher-best') || 0; } catch (e) {}
  $('best').textContent = best;

  const player = { x: W/2, w: 90, h: 16, y: H - 40, speed: 7 };
  let items, score, lives, spawnT, frame, running, keys = {}, targetX = null;

  const msgs = ['fix typo', 'add feature', 'refactor', 'update README', 'merge main', 'init commit', 'bump version', 'add tests'];

  function reset() {
    items = []; score = 0; lives = 3; spawnT = 0; frame = 0;
    player.x = W/2; targetX = null;
    updateHud();
  }

  function updateHud() {
    $('score').textContent = score;
    $('lives').textContent = '♥'.repeat(Math.max(lives, 0)) || '–';
    $('best').textContent = best;
  }

  function spawn() {
    const bug = Math.random() < Math.min(0.25 + score / 400, 0.5);
    items.push({
      x: 30 + Math.random() * (W - 60), y: -20,
      v: 2 + Math.random() * 1.5 + Math.min(score / 60, 4),
      bug, label: bug ? 'bug' : msgs[(Math.random() * msgs.length) | 0], r: 14
    });
  }

  function update() {
    frame++;
    if (keys.ArrowLeft || keys.a) player.x -= player.speed;
    if (keys.ArrowRight || keys.d) player.x += player.speed;
    if (targetX !== null) player.x += (targetX - player.x) * 0.25;
    player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));

    spawnT--;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(18, 55 - score / 4); }

    for (const it of items) it.y += it.v;

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      const caught = it.y + it.r >= player.y && it.y - it.r <= player.y + player.h &&
                     Math.abs(it.x - player.x) < player.w/2 + it.r * 0.6;
      if (caught) {
        if (it.bug) lives--; else score += 10;
        items.splice(i, 1);
      } else if (it.y > H + 20) {
        if (!it.bug) lives--;   // commit terlewat = kehilangan nyawa
        items.splice(i, 1);
      }
    }
    updateHud();
    if (lives <= 0) gameOver();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    // grid latar
    ctx.strokeStyle = 'rgba(48,54,61,.45)'; ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = (frame * 1) % 40; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // pemain (branch)
    ctx.fillStyle = '#58a6ff';
    roundRect(player.x - player.w/2, player.y, player.w, player.h, 8); ctx.fill();
    ctx.fillStyle = '#0d1117'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
    ctx.fillText('main', player.x, player.y + 12);

    // item
    for (const it of items) {
      ctx.fillStyle = it.bug ? '#f85149' : '#3fb950';
      ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = it.bug ? '#fff' : '#04210d';
      ctx.font = 'bold 13px monospace';
      ctx.fillText(it.bug ? '✕' : '●', it.x, it.y + 5);
      ctx.fillStyle = '#8b949e'; ctx.font = '10px monospace';
      ctx.fillText(it.label, it.x, it.y - 20);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function loop() {
    if (!running) return;
    update(); draw();
    if (running) requestAnimationFrame(loop);
  }

  function start() {
    reset(); running = true; overlay.style.display = 'none'; loop();
  }

  function gameOver() {
    running = false;
    if (score > best) {
      best = score;
      try { localStorage.setItem('commit-catcher-best', best); } catch (e) {}
    }
    updateHud();
    msg.innerHTML = `Game over!<br>Skor kamu: <b style="color:#3fb950">${score}</b><br>Rekor: <b>${best}</b>`;
    $('start').textContent = 'Main Lagi';
    overlay.style.display = 'flex';
  }

  // kontrol
  addEventListener('keydown', e => {
    keys[e.key] = true;
    if ((e.key === 'Enter' || e.key === ' ') && !running) start();
    if (e.key.startsWith('Arrow')) e.preventDefault();
  });
  addEventListener('keyup', e => { keys[e.key] = false; });

  function pointerX(e) {
    const rect = cv.getBoundingClientRect();
    return (e.clientX - rect.left) * (W / rect.width);
  }
  cv.addEventListener('pointermove', e => { targetX = pointerX(e); });
  cv.addEventListener('pointerdown', e => { targetX = pointerX(e); });
  cv.addEventListener('pointerleave', () => { targetX = null; });

  $('start').addEventListener('click', start);
  draw();
})();
</script>
</body>
</html>
